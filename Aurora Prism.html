<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fractal Mandala</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .vignette {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle, transparent 40%, #000 150%);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="vignette"></div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let hue = 0;
        const symmetry = 12;
        const mouse = { x: 0, y: 0, lastX: 0, lastY: 0 };
        let angle = 0;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            ctx.translate(width / 2, height / 2);
            clear();
        }

        function clear() {
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, width, height);
        }

        window.addEventListener('resize', resize);
        window.addEventListener('mousemove', (e) => {
            mouse.lastX = mouse.x;
            mouse.lastY = mouse.y;
            mouse.x = e.clientX - width / 2;
            mouse.y = e.clientY - height / 2;
        });
        window.addEventListener('mousedown', clear);

        function drawMandala() {
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.03)';
            ctx.fillRect(0, 0, width, height);
            ctx.translate(width / 2, height / 2);

            hue += 0.5;
            angle += 0.002;

            const dx = mouse.x - mouse.lastX;
            const dy = mouse.y - mouse.lastY;
            const dist = Math.hypot(dx, dy);

            for (let i = 0; i < symmetry; i++) {
                ctx.save();
                ctx.rotate((Math.PI * 2 / symmetry) * i + angle);

                ctx.beginPath();
                ctx.moveTo(mouse.lastX, mouse.lastY);
                ctx.lineTo(mouse.x, mouse.y);

                ctx.strokeStyle = `hsla(${hue + i * 10}, 100%, 60%, 0.8)`;
                ctx.lineWidth = Math.max(0.5, 10 - dist * 0.5);
                ctx.lineCap = 'round';
                ctx.shadowBlur = 15;
                ctx.shadowColor = `hsla(${hue + i * 10}, 100%, 60%, 0.5)`;
                ctx.stroke();

                ctx.scale(1, -1);
                ctx.beginPath();
                ctx.moveTo(mouse.lastX, mouse.lastY);
                ctx.lineTo(mouse.x, mouse.y);
                ctx.stroke();

                ctx.restore();
            }
        }

        resize();

        function animate() {
            drawMandala();
            requestAnimationFrame(animate);
        }

        mouse.x = mouse.lastX = 0;
        mouse.y = mouse.lastY = 0;
        animate();
    </script>
</body>
</html>
